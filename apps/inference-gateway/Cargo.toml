[package]
name = "zene-inference-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dev inference gateway: UniGateway session + upstream proxy"
publish = false

[lib]
name = "zene_inference_gateway"
path = "src/lib.rs"

[[bin]]
name = "zene-inference-gateway"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unigateway-sdk = { workspace = true, features = ["host", "session"] }
unigateway-session = { workspace = true, features = ["http"] }
unigateway-session-redis = { workspace = true }
zene-llm = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
http-body-util = "0.1"
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
zene-inference-gateway = { path = "." }
