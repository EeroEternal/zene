[workspace]
members = [
    "apps/api",
    "apps/worker",
    "crates/domain",
    "crates/db",
    "crates/acp-bridge",
    "crates/github",
    "crates/git-broker",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
authors = ["Zene Cloud Contributors"]

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zene-cloud-acp-bridge = { path = "crates/acp-bridge" }
zene-cloud-db = { path = "crates/db" }
zene-cloud-domain = { path = "crates/domain" }
zene-cloud-github = { path = "crates/github" }
zene-cloud-git-broker = { path = "crates/git-broker" }
