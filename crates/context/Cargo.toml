[package]
name = "zene-context"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Semantic context engine for LLM agents: estimate, compact, assemble, epoch"
readme = "README.md"
repository = "https://github.com/ParaTensor/zene"
keywords = ["llm", "context", "compaction", "agent"]
categories = ["development-tools", "asynchronous"]

[features]
default = ["memory", "gateway", "prefire"]
memory = []
gateway = ["dep:reqwest"]
prefire = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tiktoken-rs = "0.12"
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"], optional = true }
zene-llm = { workspace = true }
zene-session = { workspace = true }

[dev-dependencies]
tempfile = "3"
