name: Deploy Zene Cloud

on:
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "apps/cli/**"
      - "apps/inference-gateway/**"
      - "crates/**"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:

concurrency:
  group: deploy-zene-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build cloud API and worker
        working-directory: cloud
        run: cargo build --release -p zene-cloud-api -p zene-cloud-worker --locked

      - name: Build zene CLI and inference gateway
        run: |
          cargo build --release -p zene-cli -p zene-inference-gateway --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/apps/web/package-lock.json

      - name: Build web UI
        working-directory: cloud/apps/web
        run: npm ci && npm run build

      - name: Stage artifacts
        run: |
          STAGE=.deploy-stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE/bin" "$STAGE/web" "$STAGE/systemd"
          cp cloud/target/release/zene-cloud-api cloud/target/release/zene-cloud-worker "$STAGE/bin/"
          cp target/release/zene target/release/zene-inference-gateway "$STAGE/bin/"
          cp -a cloud/apps/web/dist/. "$STAGE/web/"
          cp cloud/deploy/systemd/*.service "$STAGE/systemd/"
          cp cloud/deploy/Caddyfile cloud/deploy/install-remote.sh "$STAGE/"

      - name: Upload to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ZENE_CLOUD_HOST }}
          username: ${{ secrets.ZENE_CLOUD_USER }}
          key: ${{ secrets.ZENE_CLOUD_SSH_KEY }}
          source: ".deploy-stage/*"
          target: /tmp/zene-cloud-stage
          strip_components: 1
          overwrite: true
          rm: true

      - name: Install and restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ZENE_CLOUD_HOST }}
          username: ${{ secrets.ZENE_CLOUD_USER }}
          key: ${{ secrets.ZENE_CLOUD_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo STAGE_DIR=/tmp/zene-cloud-stage bash /tmp/zene-cloud-stage/install-remote.sh
