name: DNS zene.run

on:
  workflow_dispatch:
    inputs:
      static_ip:
        description: GCE static IP for zene.run
        required: true
        default: "34.150.72.131"

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upsert Cloudflare DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATIC_IP: ${{ inputs.static_ip }}
        run: bash cloud/deploy/dns-cloudflare.sh
